spring.application.name=nified-permission-system
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
permission.jwt.secret=${PERMISSION_JWT_SECRET:}
permission.jwt.expiration-seconds=${PERMISSION_JWT_EXPIRATION_SECONDS:900}

# Local-only by default. No fixed development signing secret.
server.address=127.0.0.1
permission.bootstrap.username=${PERMISSION_BOOTSTRAP_USERNAME:}
permission.bootstrap.password=${PERMISSION_BOOTSTRAP_PASSWORD:}
permission.integration.hr-secret=${PERMISSION_HR_SECRET:}
permission.integration.oa-secret=${PERMISSION_OA_SECRET:}
permission.oidc.client-secret=${PERMISSION_OIDC_CLIENT_SECRET:}
permission.oidc.issuer=${PERMISSION_OIDC_ISSUER:}

# Explicit course demonstration origin only; HTTPS remains the default for remote applications.
permission.application.http-demo-origin=${PERMISSION_APPLICATION_HTTP_DEMO_ORIGIN:}
