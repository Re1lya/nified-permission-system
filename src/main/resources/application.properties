spring.application.name=nified-permission-system
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
permission.jwt.secret=${PERMISSION_JWT_SECRET:}
permission.jwt.expiration-seconds=${PERMISSION_JWT_EXPIRATION_SECONDS:7200}

# Local-only by default. No fixed development signing secret.
server.address=127.0.0.1
permission.bootstrap.username=${PERMISSION_BOOTSTRAP_USERNAME:}
permission.bootstrap.password=${PERMISSION_BOOTSTRAP_PASSWORD:}
