server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unified_permission?useUnicode=true&characterEncoding=utf8&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:unified_permission}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: false

permission:
  jwt:
    secret: ${PERMISSION_JWT_SECRET}
    expiration-seconds: ${PERMISSION_JWT_EXPIRATION_SECONDS:900}

# A shared database persists HTTP sessions, OIDC clients, authorizations and signing keys.
# Apply docs/migrations/20261022-phase-one-completion.sql before starting this version.
