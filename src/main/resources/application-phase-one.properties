server.address=127.0.0.1
server.port=18081
spring.datasource.url=jdbc:h2:mem:phase-one-demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
permission.integration.hr-secret=${PERMISSION_HR_SECRET:}
permission.integration.oa-secret=${PERMISSION_OA_SECRET:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
permission.oidc.client-secret=${PERMISSION_OIDC_CLIENT_SECRET:}
